<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #1f2a37;
      }
      main {
        padding: 2rem 2.5rem;
        border-radius: 12px;
        background: white;
        box-shadow: 0 12px 30px rgba(31, 42, 55, 0.15);
        text-align: center;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 8px;
        background: #4c6ef5;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #3b5bdb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello there!</h1>
      <p>This is a tiny HTML snippet with a splash of style.</p>
      <button onclick="alert('Have a great day!')">Click me</button>
    </main>
  </body>
</html>
